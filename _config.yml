# Remote theme directory
remote_theme: analytics-link/analytics-link.github.io

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-remote-theme

#-------------------------------
# General Site Settings
title: Greg Ducie
description: "Hi I'm Greg, and I'm a data science professional, an organisational strategist, a business leader, and a specialist in human and organisational performance.  My portfolio focuses on interesting projects I've recently undertaken, with a strong emphasis on business impact. Please visit my Github & LinkedIn pages (or download my Resume) by using the links below!"
baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

#-------------------------------
# About Section
subtitle: Data Science <span style="color:#f58506"> Portfolio </span>
location: "Brisbane, Australia"
resume_url: /docs/GregDucie CV Oct 2026.pdf
avatar_image: /img/1000023340 (1).png

#-------------------------------
# Contact links
linkedln: "https://linkedin.com/in/gregducie/#" # Add your linkedln handle
github: "https://gregducie.github.io/#"  # Add your github handle

paginate: 6
paginate_path: "/page/:num"

sass:
  sass_dir: _sass
  style: compressed # possible values: nested expanded compact compressed

defaults:
  - scope:
      type: posts
    values:
      layout: post
      read_time: true
      share: false


